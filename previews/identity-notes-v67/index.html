<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>身份纸笺 V67</title><style>body{background:#eee4d0;color:#4b382b;font-family:system-ui;margin:24px}main{max-width:1300px;margin:auto}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}figure{margin:0;padding:14px;background:#dbc9a9;cursor:pointer;text-align:center}figure img{width:100%;object-fit:contain}#scene{width:100%;margin-top:20px}a{color:#8e5139}@media(max-width:650px){.grid{grid-template-columns:1fr 1fr}}</style><main><h1>六类身份委托纸笺</h1><p>简化墨线代替可读正文。点击纸笺查看对应的实际游戏场景。</p><div class="grid" id="grid"></div><img id="scene" src="merchant-scene.png" alt="实际游戏中的身份纸条"><p><a href="REVIEW.md">检查和生成记录</a></p></main><script>for(const [id,name] of [['merchant','商贾账笺'],['herbal','采药草纸'],['scholar','书生素笺'],['courier','驿路折笺'],['guard','护卫公笺'],['recluse','散修旧笺']]){let f=document.createElement('figure');f.innerHTML='<img src="'+id+'-detail.png" alt="'+name+'"><figcaption>'+name+'</figcaption>';f.onclick=()=>document.querySelector('#scene').src=id+'-scene.png';document.querySelector('#grid').append(f);}</script></html>
