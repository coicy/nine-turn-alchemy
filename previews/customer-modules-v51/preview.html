<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顾客头身与姿态修正 V51</title><style>*{box-sizing:border-box}body{margin:0;background:#e4d4b5;color:#493624;font:16px/1.7 'Microsoft YaHei',sans-serif}main{max-width:1440px;margin:auto;padding:28px}h1,h2{font-family:KaiTi,serif}button,select{font:inherit;padding:8px;background:#f7ecd6;color:#493624;border:1px solid #b3936c}nav{display:flex;gap:20px;margin:20px 0;flex-wrap:wrap}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{border:1px solid #b3936c;background:#f6ead2}.stage{height:440px;position:relative;overflow:hidden;background:linear-gradient(#eadfc9,#d7c3a3)}.character{position:absolute;width:480px;height:750px;top:10px;left:50%;transform:translateX(-50%) scale(.62);transform-origin:top center;isolation:isolate}.part{position:absolute;overflow:hidden}.art{display:block;background-repeat:no-repeat;transform-origin:top left}.caption{padding:12px}.counter{height:530px;position:relative;overflow:hidden;background:url(../../assets/scenes-v41/counter.png) center/cover}.counter .character{transform:translateX(-50%) scale(.64);top:70px}.counter:after{content:'';position:absolute;inset:0;background:inherit;clip-path:inset(58% 0 0);z-index:5;pointer-events:none}.pair{display:grid;grid-template-columns:1fr 1fr;gap:18px}.pair img{width:100%;display:block}.pair .stage{height:450px}.note{font-size:14px;color:#735b42}.zoom .character{transform:translateX(-50%) scale(.85);top:-30px}.zoom{height:380px}.samples{margin:24px 0}.samples img{max-width:100%}@media(max-width:800px){.grid{grid-template-columns:1fr}.pair{grid-template-columns:1fr}.counter .character{transform:translateX(-50%) scale(.40);top:130px}}
</style><main><h1>顾客头身比例与姿态 V51</h1><p>头部相对上一版缩小，增加肩宽和肩至腰的长度；服装、手臂与接触物件按动作成套制作，不再统一抱手。</p><nav><label>头部 <select id="head"><option value="0">青年</option><option value="1">中年</option><option value="2">长者</option></select></label><label>动作 <select id="pose"><option value="0">扶柜等候</option><option value="1">递交药包</option><option value="2">扶背篓带</option></select></label></nav><div class="pair"><section class="card"><h2>V50 旧版结果</h2><img src="../customer-modules-v50/comparison.png" alt="旧版头身参考"></section><section class="card"><h2>V51 实际拼接</h2><div id="selected" class="stage"></div></section></div><h2>三种姿态 × 三个头部</h2><p class="note">下列全部为组件实际叠加。递药姿态只用于交接阶段；扶柜与扶带用于等候，不能无视业务状态随机播放。</p><div id="grid" class="grid"></div><h2>柜台接触位置检查</h2><div id="counter" class="counter"></div><h2>肩颈放大检查</h2><div id="zooms" class="grid"></div><details class="samples"><summary>完整人物比例母稿（设计参考，不是组件拼接成品）</summary><img src="proportion-master.png" alt="完整人物站姿与头身比例设计稿"></details><p class="note">此批检验静态比例与业务姿态；不将静态接触图当作已完成动画，也不直接替换线上游戏人物。</p></main><script>
const heads=[{x:55,y:15,w:350,h:550,left:148},{x:455,y:30,w:340,h:540,left:130},{x:875,y:30,w:340,h:540,left:134}],poses=[{x:0,y:90,w:650,h:770,left:-7},{x:650,y:90,w:550,h:770,left:44},{x:1200,y:90,w:600,h:770,left:25}],names=['青年','中年','长者'],actions=['扶柜等候','递交药包','扶背篓带'];
function part(r,scale,file,size,top,z){const w=document.createElement('i');w.className='part';w.style.cssText=`width:${r.w*scale}px;height:${r.h*scale}px;left:${r.left}px;top:${top}px;z-index:${z}`;const a=document.createElement('i');a.className='art';a.style.cssText=`background-image:url(${file});background-size:${size};background-position:-${r.x}px -${r.y}px;width:${r.w}px;height:${r.h}px;transform:scale(${scale})`;w.append(a);return w;}
function character(h,p){const el=document.createElement('div');el.className='character';el.dataset.head=h;el.dataset.pose=p;el.setAttribute('role','img');el.setAttribute('aria-label',names[h]+'，'+actions[p]);const torso=part(poses[p],.65,'pose-components.png','1800px 900px',170,1);if(p===2)torso.style.clipPath='inset(0 0 0 6%)';el.append(torso,part(heads[h],.42,'../customer-modules-v50/components-source.png','1280px 1280px',15,2));return el;}
for(let p=0;p<3;p++)for(let h=0;h<3;h++){const c=document.createElement('article');c.className='card';const stage=document.createElement('div');stage.className='stage';stage.append(character(h,p));const caption=document.createElement('div');caption.className='caption';caption.textContent=names[h]+' · '+actions[p];c.append(stage,caption);document.getElementById('grid').append(c);}
for(let i=0;i<3;i++){const c=character(i,i);c.style.left=[21,50,79][i]+'%';document.getElementById('counter').append(c);const z=document.createElement('div');z.className='stage zoom card';z.append(character(i,i));document.getElementById('zooms').append(z);}
function update(){document.getElementById('selected').replaceChildren(character(+document.getElementById('head').value,+document.getElementById('pose').value));}document.getElementById('head').onchange=update;document.getElementById('pose').onchange=update;update();
</script></html>
