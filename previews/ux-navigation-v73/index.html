<div class="proposal"><span>V73 · UX/UI可点击布局提案｜示例数据，不执行游戏业务</span><span>演出另见分镜文档；此处只核查层级、状态与返回关系</span></div>
<main class="frame"><header class="top"><nav class="places" aria-label="地点"><button data-place="work">← 炼丹房</button><button data-place="orders">接待柜台</button><button data-place="shop">坊市 →</button></nav><div class="wallet"><span>第 3 天 · 225 铜钱</span><button data-open="settings">设置</button></div></header><section class="scene" data-scene="orders"></section></main>
<script>
const root=document.querySelector('.scene'),base='../../assets/';let place='orders',panel=null,forgeState='live',category='材料',origin=null;
const parcel=base+'counter-props-v72/herb-parcel.png';
const tools=()=>'<div class="tools"><button data-open="record">经营簿</button><button data-open="manual">丹纹炉谱</button></div>';
function render(){root.dataset.scene=place;root.className='scene'+(panel==='equipment'?' equipped':'')+(panel&&panel!=='equipment'?' reading':'');document.querySelectorAll('[data-place]').forEach(b=>b.setAttribute('aria-current',b.dataset.place===place));let html=tools();
if(place==='orders')html+='<div class="scene-info tag">第3天 · 今日完成 2 / 7 单</div><button class="book-launch" data-open="daily">今日委托簿 · 5位待接</button><img class="person" src="'+base+'customers-v61/clothier.png" alt="当前客人陆绣"><div class="speech tag">陆绣 · 坊市行商<br>劳烦掌柜替伙计备些行路丹。</div><div data-content class="parcels">'+[1,2,3].map(()=>'<img src="'+parcel+'" alt="客人药包">').join('')+'</div><button data-content class="note" data-open="letter"><img src="'+base+'counter-props-v72/merchant.png" alt="陆绣的委托纸笺"><span>查看来笺</span></button><div class="bottom"><button data-demo="日结需先处理当前炉与委托；样稿不执行结算">敲铃 · 结束今日</button></div>';
if(place==='work'){let live=forgeState!=='empty';html+='<div class="work-target tag">陆绣 · 补充行囊<br>已交付 48 / 120 · 本单余料2份</div><div class="work-inventory" data-content><h3>药匣 · 取一份投炉</h3><div class="slots">'+Array.from({length:6},(_,i)=>'<button class="slot" data-demo="样稿仅展示药匣位置；投料沿用游戏拖动"><img src="'+parcel+'" alt="药包"><small>'+(i<2?'2':'—')+'</small></button>').join('')+'</div><div class="inventory-source">同一药匣 · 本单 / 自有来源标识</div></div><div class="observation" data-content><h3>炉旁观丹</h3>'+(live?'<img class="pill" src="'+base+'runtime-v10/color-07-slate.webp" alt="炉中丹"><div>当前丹值</div><div class="value">72</div><div class="risk">下次炸炉 12%</div><div class="observe-details">三转 · 良品 · 2/6道纹<br>'+(forgeState==='busy'?'本次炼化中，结果落定后再换景':forgeState==='choice'?'请先完成本次显纹选择':'拖动丹药至收丹盘')+'</div>':'<p>空炉 · 从左侧药匣取料</p>')+'</div><span class="fire-hint" data-content>火口 · 点击扇风</span><span class="tray-hint tag" data-content>收丹盘 · 计入本单</span><button class="drawer-entry" data-open="equipment">打开法器匣</button><div class="work-hint">'+(forgeState==='empty'?'取药 → 投入炉口':forgeState==='busy'?'炼化中 · 稍候查看结果':forgeState==='choice'?'显纹候选保持在炉旁':'继续炼化，或拖丹收取')+'</div><label class="state-control">状态样例 <select id="forgeState">'+[['empty','空炉'],['live','炉内有丹'],['busy','炼化中'],['choice','显纹选择']].map(([v,t])=>'<option value="'+v+'" '+(v===forgeState?'selected':'')+'>'+t+'</option>').join('')+'</select></label>';}
if(place==='shop')html+='<div class="scene-info tag">坊市 · 看货与购买</div><div class="categories">'+['材料','法器','炉具'].map(c=>'<button data-category="'+c+'" aria-pressed="'+(category===c)+'">'+c+'</button>').join('')+'</div><div class="goods" data-content>'+['普通药包','精选药包'].map(t=>'<button data-demo="选中货物，在右侧价签查看详情"><img src="'+parcel+'" alt="'+t+'"><strong>'+t+'</strong></button>').join('')+'</div><div class="price-card" data-content><small>'+category+' · 所选货物</small><h2>'+({材料:'普通药包',法器:'镇炉印',炉具:'丹炉改良'}[category])+'</h2><p>用途与限制在此展开，陈列区保持清楚。</p><strong>价格以实际游戏目录为准</strong><button class="primary" data-demo="样稿不扣款；实际购买先校验，再播放入库反馈">查看价签 / 购买</button><button data-place="work">'+(category==='法器'?'回房配装':'返回炼丹房')+'</button></div>';
root.innerHTML=html;if(panel)showPanel();}
function showPanel(){let box=document.createElement('section');box.className='sheet';box.setAttribute('aria-label',panel==='equipment'?'法器匣':'阅读面板');box.setAttribute('role',panel==='equipment'?'region':'dialog');if(panel!=='equipment')box.setAttribute('aria-modal','true');let h='<button class="close" data-close aria-label="关闭">×</button>';
if(panel==='letter'){box.classList.add('letter');h+='<small>来客手书 · 待接单</small><h2>补充行囊</h2><p>掌柜亲启：</p><p>在下陆绣，托付3包药材，请代炼成丹。</p><p>所求丹值 <strong>120</strong>　约定工钱 <strong>48铜钱</strong></p><p class="terms">成丹归客，未成免赔。成功后未用药材赠予掌柜。</p><button class="primary" data-demo="样稿不接单；主游戏应先接单成功，再收料并转入炼丹房">落印接下 · 携料回房</button>'}
if(panel==='equipment'){box.classList.add('drawer');h+='<small>炉旁器具 · 三槽组合</small><h2>法器匣</h2>'+['镇炉印','生纹针','未装备'].map((t,i)=>'<div class="tool-slot">第'+(i+1)+'槽 · '+t+'</div>').join('')+'<p>装备效果在同一处查看，自动触发不增加炉内按钮。</p><button '+(forgeState!=='empty'?'disabled':'')+' data-demo="样稿不改变装备">'+(forgeState==='empty'?'空炉 · 可以换装':'炉中有丹 · 收丹后换装')+'</button><small>背景不变暗，炉旁决策区为侧匣让位。</small>'}
if(panel==='record'||panel==='manual'){box.classList.add('reader');h+='<div class="spread"><div><small>随身书册</small><h2>'+(panel==='record'?'经营簿':'丹纹炉谱')+'</h2><p>'+(panel==='record'?'今日收支<br>委托记录<br>余药入匣<br>三十日总览':'六类丹纹<br>自动触发<br>法器组合<br>炼化风险')+'</p></div><div><h2>'+(panel==='record'?'今日经营':'丹纹与组合')+'</h2><p>'+(panel==='record'?'完成 2 / 7 单<br>工钱与加赏分别记录<br>收入与支出明确分列<br>点击记录再查看详情':'六纹能力及继承关系沿用游戏规则。<br>查看资料不改变当前丹药。<br>不以翻阅触发重抽或消耗次数。')+'</p><p class="terms">这里是布局示意，不读取真实存档。</p></div></div><span class="back-label">合册后返回'+({work:'炼丹房',orders:'接待柜台',shop:'坊市'}[place])+'</span>'}
if(panel==='daily'){box.classList.add('list');h+='<h2>今日委托簿</h2><small>选中来笺 · 待接</small><button class="customer-row" data-demo="查看当前单，不重复领料">陆绣 · 补充行囊 · 待接</button><h3>待接 · 5位</h3>'+['驿路信使','山间药农','游学弟子'].map(n=>'<button class="customer-row" data-demo="主游戏选客后收簿，客人到位再出现对应纸笺">'+n+' · 查看来笺</button>').join('')+'<h3>已处理</h3><p>2单 · 展开记录</p>'}
if(panel==='settings'){box.classList.add('letter');h+='<h2>设置</h2><p>音效 · 开</p><p>减少动态效果</p><p>选择存档 · 保留现有安全检查</p><p class="terms">设置从地点导航中分离；关闭回原场景。</p>'}
box.innerHTML=h;root.append(box);if(panel!=='equipment'){root.querySelectorAll(':scope > :not(.sheet)').forEach(el=>el.inert=true);}box.querySelector('button')?.focus({preventScroll:true});}
function toast(t){document.querySelector('.toast')?.remove();let e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.textContent=t;root.append(e);setTimeout(()=>e.remove(),2300)}
function close(){panel=null;render();if(origin){const target=document.querySelector(origin);target?.focus({preventScroll:true})}}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.place){if(place==='work'&&['busy','choice'].includes(forgeState)){toast(forgeState==='busy'?'请先等待本次结果；样稿展示锁定原因':'请先完成炉旁显纹选择');return}place=b.dataset.place;panel=null;render()}else if(b.dataset.open){if(place==='work'&&['busy','choice'].includes(forgeState)){toast('先处理当前炉旁结果，再打开阅读界面');return}origin='[data-open="'+b.dataset.open+'"]';panel=b.dataset.open;render()}else if(b.hasAttribute('data-close'))close();else if(b.dataset.category){category=b.dataset.category;render()}else if(b.dataset.demo)toast(b.dataset.demo)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&panel){e.preventDefault();close()}if(e.key==='Tab'&&panel&&panel!=='equipment'){const f=[...root.querySelector('.sheet').querySelectorAll('button:not(:disabled),select')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1)?.focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0]?.focus()}}});document.addEventListener('change',e=>{if(e.target.id==='forgeState'){forgeState=e.target.value;render()}});render();
function fit(){const w=root.clientWidth,h=root.clientHeight,s=Math.max(w/1672,h/941);root.style.setProperty('--s',s+'px');root.style.setProperty('--ox',(w-1672*s)/2+'px');root.style.setProperty('--oy',(h-941*s)/2+'px')}new ResizeObserver(fit).observe(root);fit();
