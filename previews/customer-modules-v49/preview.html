<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顾客组件组合预览 V49</title>
<style>*{box-sizing:border-box}body{margin:0;background:#e4d4b5;color:#493624;font:16px/1.7 'Microsoft YaHei',sans-serif}main{max-width:1440px;margin:auto;padding:30px}h1,h2{font-family:KaiTi,serif}h1{margin:0}p{margin:8px 0 18px}.workshop{display:grid;grid-template-columns:360px 1fr;gap:30px;padding:24px;background:#f6ead2;border:2px solid #b99b73;margin-bottom:30px}button,select{padding:10px;background:#f6ead2;border:1px solid #ae8d63;border-radius:4px;color:#493624;font:inherit}button{cursor:pointer}button[aria-pressed=true]{background:#934d35;color:#fff1d7}.controls{display:grid;gap:16px;align-content:center}.controls label{display:block}.character{width:360px;height:710px;position:relative;overflow:hidden;isolation:isolate}.layer{position:absolute;background-image:url(components-v3.png);background-size:300% 200%;background-repeat:no-repeat;pointer-events:none}.body{width:340px;height:510px;left:0;top:200px;z-index:2}.head{width:190px;height:285px;left:90px;top:15px;z-index:1}.basket{width:340px;height:510px;left:50px;top:130px;background-position:100% 100%;z-index:0}.portrait{height:426px;position:relative;overflow:hidden;border-bottom:4px solid #94704b;background:linear-gradient(#e9ddc5,#d3c09e)}.portrait .character{position:absolute;left:50%;top:0;transform:translateX(-50%) scale(.6);transform-origin:top center}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}.card{background:#f5e9d1;border:1px solid #b99b73}.caption{padding:12px}.caption strong{display:block}.caption small{color:#745c42}.showcase{height:512px;overflow:hidden;position:relative;background:#e9ddc5;border:1px solid #b99b73}.showcase .character{position:absolute;left:50%;transform:translateX(-50%) scale(.72);transform-origin:top center}details{margin:25px 0}details img{display:block;width:min(800px,100%);background:#d0c0a3;margin:auto}.note{font-size:14px;color:#725c43}@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}.workshop{grid-template-columns:1fr}.showcase{max-width:400px;width:100%;margin:auto}}@media(max-width:480px){main{padding:15px}.grid{gap:8px}.portrait{height:270px}.portrait .character{transform:translateX(-50%) scale(.415)}.caption{font-size:13px}}
.head{clip-path:inset(0 0 0 5%)}.body[data-index="1"]{clip-path:inset(0 0 0 12%)}</style><main><h1>顾客组件 · 实际组合预览</h1><p>3 个头部 × 2 套服装 × 背篓有无＝12 种外观搭配。全部叠加同一张透明组件图集，未重新生成成品人物。</p><div class="workshop"><div id="showcase" class="showcase"></div><div class="controls"><h2>检查一个兼容组</h2><label>头部 <select id="head"><option value="0">青年 · 束发</option><option value="1">中年 · 巾帽</option><option value="2">长者 · 灰发</option></select></label><label>服装 <select id="body"><option value="0">赭黄交领袍</option><option value="1">灰青行旅袍</option></select></label><button id="basket" aria-pressed="false">背篓：未装备</button><p class="note">验证范围：同一成人体型、同一站姿与机位。当前为中性等候姿态，不含表情组和递物动画。背篓变体只验证轮廓，不代表每种搭配都适合全部职业。</p></div></div><h2>组合矩阵</h2><div class="grid" id="grid"></div><details><summary>查看六组件原图</summary><img src="components-v3.png" alt="三头部、两套躯干服装和一个背篓组件"></details><p class="note">V49 制作样张。换装复用同一个头部；年龄和服装不是十二个不同身份。保留初稿以便对比衣领修正。</p></main>
<script>const names=['青年束发','中年巾帽','长者灰发'],robes=['赭黄袍','灰青袍'];function character(h,b,basket){const e=document.createElement('div');e.className='character';e.dataset.head=h;e.dataset.body=b;e.dataset.basket=basket;e.setAttribute('role','img');e.setAttribute('aria-label',names[h]+'，'+robes[b]+(basket?'，背药篓':''));if(basket){const l=document.createElement('i');l.className='layer basket';e.append(l);}const head=document.createElement('i');head.className='layer head';head.style.backgroundPosition=h*50+'% 0%';const body=document.createElement('i');body.className='layer body';body.dataset.index=b;body.style.backgroundPosition=b*50+'% 100%';e.append(head,body);return e;}for(let basket=0;basket<2;basket++)for(let h=0;h<3;h++)for(let b=0;b<2;b++){const card=document.createElement('article');card.className='card';const portrait=document.createElement('div');portrait.className='portrait';portrait.append(character(h,b,!!basket));const caption=document.createElement('div');caption.className='caption';const title=document.createElement('strong');title.textContent=names[h]+' · '+robes[b];const text=document.createElement('small');text.textContent=basket?'背篓变体':'基础组合';caption.append(title,text);card.append(portrait,caption);document.getElementById('grid').append(card);}let basket=false;function update(){document.getElementById('showcase').replaceChildren(character(+document.getElementById('head').value,+document.getElementById('body').value,basket));}document.getElementById('head').onchange=update;document.getElementById('body').onchange=update;document.getElementById('basket').onclick=e=>{basket=!basket;e.currentTarget.setAttribute('aria-pressed',basket);e.currentTarget.textContent='背篓：'+(basket?'已装备':'未装备');update();};update();</script></html>
