<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>顾客模块 V50 · 设计与验收</title><style>
*{box-sizing:border-box}body{margin:0;background:#e4d4b5;color:#493624;font:16px/1.7 'Microsoft YaHei',sans-serif}main{max-width:1440px;margin:auto;padding:28px}h1,h2{font-family:KaiTi,serif}h1{margin:0}.note{color:#705a40;font-size:14px}.controls{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:20px 0}select,button{font:inherit;background:#f7ecd6;color:#493624;padding:9px 14px;border:1px solid #a98b63;border-radius:4px}button{cursor:pointer}button[aria-pressed=true]{background:#934d35;color:#fff1d7}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel,.card{background:#f6ead2;border:1px solid #b59972}.panel h2{margin:12px 20px}.stage{height:450px;overflow:hidden;position:relative;background:linear-gradient(#e9ddc5,#d8c5a5)}.character{position:absolute;left:50%;top:0;width:420px;height:740px;transform:translateX(-50%) scale(.6);transform-origin:top center;overflow:hidden;isolation:isolate}.part{position:absolute;overflow:hidden}.art{display:block;background-image:url(components-source.png);background-size:1280px 1280px;background-repeat:no-repeat;transform-origin:top left}.old{width:360px;height:710px;transform:translateX(-50%) scale(.6)}.old .layer{position:absolute;background-image:url(../customer-modules-v49/components-v3.png);background-size:300% 200%;background-repeat:no-repeat}.old .head{width:190px;height:285px;left:90px;top:15px;z-index:1;clip-path:inset(0 0 0 5%)}.old .body{width:340px;height:510px;left:0;top:200px;z-index:2}.old .body.second{clip-path:inset(0 0 0 12%)}.old .basket{width:340px;height:510px;left:50px;top:130px;background-position:100% 100%;z-index:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.grid .stage{height:370px}.grid .character{transform:translateX(-50%) scale(.5)}.caption{padding:12px}.caption strong{display:block}.counter{height:550px;background:url(../../assets/scenes-v41/counter.png) center/cover;position:relative;overflow:hidden}.counter .character{top:65px;transform:translateX(-50%) scale(.58);clip-path:inset(0 0 195px)}.counter .ledge{position:absolute;top:370px;bottom:0;left:0;right:0;background:linear-gradient(#96704b,#63462e);border-top:8px solid #b88c58;z-index:8}.counter .tag{position:absolute;bottom:35px;left:30px;z-index:9;background:#f6ead2;padding:8px 18px}.zooms{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.zooms .stage{height:330px}.zooms .character{top:-100px;transform:translateX(-50%) scale(1.1)}details{margin:25px 0}details img{max-width:100%;background:#cdbb9b}footer{margin:25px 0;font-size:14px}@media(max-width:850px){.grid{grid-template-columns:repeat(2,1fr)}.pair{grid-template-columns:1fr}.zooms{grid-template-columns:1fr}.counter{height:450px}.counter .character{transform:translateX(-50%) scale(.45)}.counter .ledge{top:320px}}
.character:not(.old){transform:translateX(-50%) scale(.65)}.grid .character{transform:translateX(-50%) scale(.55)}.zooms .character{transform:translateX(-50%) scale(1.1)}.counter .character{transform:translateX(-50%) scale(.58)}.counter .ledge{inset:0;background:url(../../assets/scenes-v41/counter.png) center/cover;border:0;clip-path:inset(58% 0 0)}</style><main><h1>顾客模块 V50 · 新设计与实际验收</h1><p>保留三头部、两套服装、可选背篓的组织。新方案：归纳淡彩，头颈与内领一体，外衣遮住组件边界。</p><div class="controls"><label>头部 <select id="head"><option value="0">青年</option><option value="1">中年</option><option value="2">长者</option></select></label><label>服装 <select id="body"><option value="0">赭黄交领袍</option><option value="1">灰青行旅袍</option></select></label><button id="basket" aria-pressed="false">背篓：关</button></div><div class="pair"><section class="panel"><h2>上一版 V49</h2><div class="stage" id="old"></div></section><section class="panel"><h2>新设计 V50</h2><div class="stage" id="new"></div></section></div><h2>领口与头颈放大检查</h2><p class="note">放大检查不是单独生成的成品图，仍来自相同组件。检查长颈、重叠衣领、断边与露底。</p><div class="zooms" id="zooms"></div><h2>12 种搭配矩阵</h2><div class="grid" id="grid"></div><h2>柜台尺度参考</h2><div class="counter" id="counter"><div class="ledge"></div><span class="tag">人物场景搭配参考 · 尚未接入运行游戏</span></div><details><summary>展开新组件源图</summary><img src="components-source.png" alt="V50六组件图集"></details><footer>验收结果另见 ACCEPTANCE.md。本页不把12种衣装搭配当作12位独立人物，也不代表完成表情或动作资产。</footer></main><script>
const H=[{x:55,y:15,w:350,h:550,left:110,top:0},{x:455,y:30,w:340,h:540,left:90,top:0},{x:875,y:30,w:340,h:540,left:95,top:0}],B=[{x:0,y:575,w:440,h:670,left:20,top:205},{x:445,y:580,w:440,h:660,left:20,top:205}],P={x:890,y:630,w:380,h:550,left:215,top:160};
function part(r,scale,z){const wrapper=document.createElement('i');wrapper.className='part';wrapper.style.cssText=`left:${r.left}px;top:${r.top}px;width:${r.w*scale}px;height:${r.h*scale}px;z-index:${z}`;const art=document.createElement('i');art.className='art';art.style.cssText=`width:${r.w}px;height:${r.h}px;background-position:-${r.x}px -${r.y}px;transform:scale(${scale})`;wrapper.append(art);return wrapper;}
function character(h,b,basket=false,old=false){const el=document.createElement('div');el.className='character'+(old?' old':'');el.dataset.head=h;el.dataset.body=b;el.dataset.basket=basket;el.setAttribute('role','img');el.setAttribute('aria-label',['青年','中年','长者'][h]+'，'+['赭黄袍','灰青袍'][b]+(basket?'，背篓':''));if(old){if(basket){const p=document.createElement('i');p.className='layer basket';el.append(p);}for(const type of ['head','body']){const p=document.createElement('i');p.className='layer '+type+(type==='body'&&b?' second':'');p.style.backgroundPosition=(type==='head'?h:b)*50+'% '+(type==='head'?0:100)+'%';el.append(p);}}else{if(basket)el.append(part(P,.55,0));const torso=document.createElement('i');torso.className='part clean-torso';torso.style.cssText=`left:${b?-15:-5}px;top:205px;width:440px;height:440px;z-index:1;background-image:url(torsos-clean.png);background-size:200% 100%;background-position:${b*100}% 0`;el.append(torso,part(H[h],.55,2));}return el;}
for(let basket=0;basket<2;basket++)for(let h=0;h<3;h++)for(let b=0;b<2;b++){const card=document.createElement('article');card.className='card';const stage=document.createElement('div');stage.className='stage';stage.append(character(h,b,!!basket));const caption=document.createElement('div');caption.className='caption';caption.textContent=['青年','中年','长者'][h]+' · '+['赭黄袍','灰青袍'][b]+(basket?' · 背篓':'');card.append(stage,caption);document.getElementById('grid').append(card);}
for(let h=0;h<3;h++){const stage=document.createElement('div');stage.className='stage panel';stage.append(character(h,0));document.getElementById('zooms').append(stage);const c=character(h,h%2,h===2);c.style.left=[23,50,77][h]+'%';document.getElementById('counter').append(c);}
let basket=false;function update(){const h=+document.getElementById('head').value,b=+document.getElementById('body').value;document.getElementById('old').replaceChildren(character(h,b,basket,true));document.getElementById('new').replaceChildren(character(h,b,basket));}document.getElementById('head').onchange=update;document.getElementById('body').onchange=update;document.getElementById('basket').onclick=e=>{basket=!basket;e.currentTarget.setAttribute('aria-pressed',basket);e.currentTarget.textContent='背篓：'+(basket?'开':'关');update();};update();
</script></html>
