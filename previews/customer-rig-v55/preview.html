<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>行商 · 同源骨骼样例 V55</title><link rel="stylesheet" href="preview.css">
<main><header><div><small>角色制作样例 · V55</small><h1>行商 · 柜前问候</h1></div><p>单一母稿 / 连续网格 / 骨骼权重<br>本轮范围：等候、招呼、点头。未接入游戏。</p></header>
<section class="stage" id="stage"><img class="master" id="master" src="master.png" alt="完整行商母稿"><canvas id="skin" width="1600" height="900" hidden></canvas><canvas id="debug" width="1600" height="900"></canvas><div class="counter"></div><div class="subtitles"><b id="phase">完整母稿</b><span id="line">先检查造型和场景尺度，再检查动作。</span></div></section>
<section class="controls"><div class="row"><button id="play">播放</button><button id="replay">重新播放</button><label>动作 <select id="motion"><option value="greet">招呼与点头</option><option value="idle">静候呼吸</option><option value="test">关节范围检查</option></select></label><label>观察 <select id="view"><option value="scene">柜台</option><option value="studio">完整立绘</option><option value="compare">母稿与零姿态对照</option><option value="weights">骨骼与权重</option></select></label><label><input id="rig" type="checkbox"> 骨架</label><label><input id="rest" type="checkbox"> 零姿态</label></div><div class="row"><label class="timeline">进度 <input id="time" type="range" min="0" max="8" value="0" step=".01"></label><output id="clock">0.00 秒</output></div></section>
<section class="notes"><p><strong>这是有范围限制的绑定样例。</strong>动作不揭露新的手掌或袖内区域；不包含递包、松指、步行或转身。连续网格的零姿态来自同一母稿，肩颈不再使用独立图片拼接。</p><p><a href="ACCEPTANCE.md">制作与审查记录</a> · <a href="rig.json">骨架与网格源数据</a> · <a href="workflow.md">固定制作流程</a></p><p>权重视图：顶点颜色表示影响最大的骨骼，完整混合权重可查看源数据。</p><span id="status">正在加载骨骼与纹理</span></section></main><script src="source.js"></script><script src="rig.js"></script></html>
