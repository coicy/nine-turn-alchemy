<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>第二批八名客人 V61</title><style>*{box-sizing:border-box}body{margin:0;background:#eee4d0;color:#4b382b;font-family:system-ui,sans-serif}main{max-width:1400px;padding:24px;margin:auto}p{line-height:1.8}nav{display:flex;gap:8px;flex-wrap:wrap;margin:20px 0}button,select{font:inherit;padding:10px;border:1px solid #ad9067;background:#f5ebd6;color:#4b382b;cursor:pointer}button[aria-pressed=true]{background:#8e5139;color:#fff1d5}#scene{position:relative;aspect-ratio:16/9;background:url('../../assets/scenes-v41/counter.png') center/100% 100%;overflow:hidden}#actor{position:absolute;object-fit:contain}#front{position:absolute;inset:55.8% 0 0;background:url('../../assets/scenes-v41/counter.png') center bottom/100% auto}#gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:24px}figure{margin:0;background:#d6c8af;text-align:center}figure img{height:370px;max-width:100%;object-fit:contain}figcaption{padding:10px;background:#f5ebd6}a{color:#8e5139}@media(max-width:700px){main{padding:12px}#gallery{grid-template-columns:repeat(2,1fr)}figure img{height:260px}}</style><main><h1>第二批八名独立客人 · V61</h1><p>本批新增八个独立个体，与原八人合计十六份静态母稿。新增八人通过内部静态场景检查，现交用户审查；尚未完成动作或接入主游戏。</p><nav id="nav"></nav><select id="bg" aria-label="检查背景"><option value="scene">实际柜台</option><option value="light">浅底</option><option value="dark">深底</option></select><p id="name"></p><div id="scene"><img id="actor" alt=""><div id="front"></div></div><section id="gallery"></section><p><a href="compare.html">与原八人场景对照</a> · <a href="REVIEW.md">检查与生成记录</a></p></main><script>const data=[["clothier","陆绣 · 布庄行商",666],["apprentice","程安 · 炉坊学徒",620],["cook","冯叔 · 食摊掌勺",640],["quarry","鲁青 · 采石工",665],["elderman","葛伯 · 山居散修",585],["teacher","沈宜 · 私塾先生",710],["escort","方成 · 行脚护送",690],["runner","吴小春 · 山路跑腿",620]];function choose(i){let [id,n,h]=data[i],a=document.querySelector('#actor');a.src=id+'.png';a.alt=n;a.style.height=h/9+'%';a.style.width=(h*2/3)/16+'%';a.style.top=(740-h)/9+'%';a.style.left=(920-h/3)/16+'%';document.querySelector('#name').textContent=n;document.querySelectorAll('button').forEach((b,j)=>b.setAttribute('aria-pressed',String(i===j)));}data.forEach(([id,n],i)=>{let b=document.createElement('button');b.textContent=n;b.onclick=()=>choose(i);document.querySelector('#nav').append(b);let f=document.createElement('figure');f.innerHTML='<img src="'+id+'.png" alt="'+n+'完整母稿"><figcaption>'+n+'</figcaption>';document.querySelector('#gallery').append(f);});document.querySelector('#bg').onchange=e=>{document.querySelector('#scene').style.background=e.target.value==='scene'?'':e.target.value==='light'?'#f7efdf':'#24352e';document.querySelector('#front').style.display=e.target.value==='scene'?'':'none';};window.ChooseCustomer=choose;choose(0);</script></html>
