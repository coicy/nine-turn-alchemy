<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>药性与品质分离预览</title><style>body{background:#102725;color:#ecd9b3;font:15px sans-serif;margin:25px}main{display:grid;grid-template-columns:repeat(5,minmax(100px,1fr));gap:20px;overflow:auto}h2{grid-column:1/-1}article{text-align:center}.pill{width:118px;height:118px;position:relative;margin:auto}.pill img{position:absolute;inset:0;width:100%;height:100%}.cracks{mask:url(assets/alchemy/pill-base-v1.png) center/contain no-repeat}.warm .body{filter:hue-rotate(-75deg) saturate(.85) brightness(1.05)}.cool .body{filter:hue-rotate(55deg) saturate(.85) brightness(.97)}.neutral .body{filter:saturate(.85)}p{font-size:12px;line-height:1.8}a{color:#efcb8b}</style><h1>丹体颜色＝药性 · 裂隙凝纹颜色＝品质</h1><p>自然凝结的裂隙式纹理，不表示丹药受损。凡品通常保持素丹；图中灰纹为存在基础丹纹时的表现。旧存档未注明药性时按平性显示。</p><main id="gallery"></main><p><a href="index.html?v=alchemy-4">进入游戏</a></p><script>const qualities=[['common','凡品 · 灰'],['fine','良品 · 青'],['superior','上品 · 蓝'],['premium','极品 · 紫'],['perfect','绝品 · 金']];document.getElementById('gallery').innerHTML=[['warm','温性 · 暖赭'],['neutral','平性 · 青绿'],['cool','寒性 · 冷蓝']].map(([nature,label])=>`<h2>${label}</h2>`+qualities.map(([file,name])=>`<article><div class="pill ${nature}"><img class="body" src="assets/alchemy/pill-base-v1.png" alt="${label}"><img class="cracks" src="assets/alchemy/pill-cracks-${file}-v3.svg" alt="${name}"></div><p>${name}</p></article>`).join('')).join('');</script></html>
