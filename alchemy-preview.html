<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>九转丹坊 · 丹炉与丹纹 V02</title><style>body{background:#102725;color:#e8d8b6;font:15px 'Microsoft YaHei',sans-serif;margin:28px}h1,h2{font-family:serif}main{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}article{background:#1d352f;border:1px solid #796b48;border-radius:9px;padding:20px}article>img{display:block;width:100%;height:230px;object-fit:contain}.demo{position:relative;width:118px;height:118px;margin:18px auto}.demo img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}.demo .overlay{mix-blend-mode:normal;opacity:.92;mask:url(assets/alchemy/pill-base-v1.png) center/contain no-repeat}.demo b{position:absolute;inset:0;display:grid;place-items:center;font:24px serif;color:#fff1c9;text-shadow:0 1px 5px #142920}p{color:#b8c5ae;font-size:12px;line-height:1.9}.quality{display:flex;flex-wrap:wrap;gap:15px;padding:20px 0}.quality figure{margin:0;text-align:center}.quality img{width:100px;height:100px;object-fit:contain}a{color:#f1d298}</style><h1>丹炉 · 丹药 · 六类丹纹</h1><p>透明 PNG 源图与 118px 丹药叠加示例。素材不新增玩法属性；文字与转数仍由程序绘制。</p><main id="gallery"></main><h2>五档品质配色</h2><p>使用同一张丹药本体，由浏览器色彩滤镜区分品质，不是五张独立生成图。</p><div id="qualities" class="quality"></div><p><a href="index.html?v=alchemy-3">进入游戏</a> · <a href="asset-preview.html">基础物件素材</a></p><script>
const base='assets/alchemy/';const asset=file=>base+file+(file.includes('surface-v2')?'.svg':'.png');const runes=[['rune-crimson-surface-v2','赤纹','火焰卷纹 · 保持后可获得护丹'],['rune-azure-surface-v2','青纹','水叶卷纹 · 减轻受损价值损失'],['rune-moon-surface-v2','月纹','月弧轨迹 · 可与雷纹融合'],['rune-thunder-surface-v2','雷纹','折线雷痕 · 可与月纹融合'],['rune-gold-surface-v2','金纹','火水交织 · 赤青融合，保留两者效果'],['rune-star-surface-v2','星痕','月弧与星节点 · 月雷融合']];
document.getElementById('gallery').innerHTML=[['furnace-v1','旧铜丹炉','开口三足铜炉，沿用原有投药和催炼点击区'],['pill-base-v1','素丹本体','玉质球形丹药，品质染色与丹纹独立叠加'],...runes].map(([file,title,note],i)=>`<article><h2>${title}</h2><img src="${asset(file)}" alt="${title}"><p>${note}</p>${i>1?`<div class="demo"><img src="${base}pill-base-v1.png" alt=""><img class="overlay" src="${asset(file)}" alt="丹纹叠加"><b>三</b></div>`:''}</article>`).join('');
const filters=['saturate(.8)','saturate(1.25) brightness(1.08)','hue-rotate(35deg) saturate(1.2) brightness(1.1)','hue-rotate(105deg) saturate(.9) brightness(1.15)','hue-rotate(-75deg) saturate(1.3) brightness(1.25)'];document.getElementById('qualities').innerHTML=['凡品','良品','上品','极品','绝品'].map((n,i)=>`<figure><img src="${base}pill-base-v1.png" style="filter:${filters[i]}" alt="${n}"><figcaption>${n}</figcaption></figure>`).join('');
</script></html>
